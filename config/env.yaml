node: renderer
portable_root: "portable"

lmstudio:
  cli: "lms"
  server_port: 1234
  context: 131072   # gemma-4 12B: 256k native; 131072 (128k) keeps it fully GPU-resident
  gpu_ratio: "max"
  models:
    showrunner: "dolphin-2.9.3-mistral-nemo-12b"

comfyui:
  krea2:
    dir: "D:/anime-h3"
    run: "run_krea2_gpu.bat"
    port: 8190
    # krea2 image gen + qwen-image-edit on a SEPARATE instance WITHOUT
    # --use-sage-attention (Qwen can't run with sage attention -> black frames).
    # H3 runs on 8188 WITH sage-attention (it requires it). One 16 GB GPU, so
    # the GPU manager's COMFYUI lock serializes the two instances.
    url: "http://127.0.0.1:8190"
    fallback_url: "http://192.168.50.173:8189"
  h3:
    dir: "D:/anime-h3"
    run: "run_h3.bat"
    port: 8188
    url: "http://127.0.0.1:8188"

ffmpeg: "C:/Program Files/Kdenlive/bin/ffmpeg.exe"

tts:
  venv: "C:/Users/Chad/PycharmProjects/LanguageLearner/.venv/Scripts/python.exe"
  sox: "C:/Users/Chad/AppData/Local/Microsoft/WinGet/Packages/ChrisBagwell.SoX_Microsoft.Winget.Source_8wekyb3d8bbwe/sox-14.4.2"
  models:
    custom_voice: "C:/Users/Chad/PycharmProjects/LanguageLearner/tts/models/Qwen3-TTS-12Hz-1.7B-CustomVoice"
    voice_design: "C:/Users/Chad/PycharmProjects/LanguageLearner/tts/models/Qwen3-TTS-12Hz-1.7B-VoiceDesign"
