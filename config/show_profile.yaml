# Defaults used by `init-show --generate` (zero-input bootstrap). See DESIGN.md §9.5a / §8.1.
# Style references (baseline / fanservice_baseline) are PER-SHOW facts: set them in
# each show's bible.yaml (e.g. `baseline: <show-title>`) instead of here.
genre: ["romantic-comedy", "martial-arts"]
tone: ["warm", "comedic", "heartfelt"]
# Maturity is a PER-SHOW fact (bible content_policy). Leave this unset to let each
# show decide; set it only if the studio wants one default level for new shows.
# maturity: ""
runtime_target_s: 1320     # 22:00
