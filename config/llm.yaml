# LM Studio configuration. See DESIGN.md §11.
# BEAST5's own LM Studio (this machine, 127.0.0.1:1234) is the PRIMARY LLM: the
# router sends calls there whenever it has capacity. When BEAST5 is busy (its
# concurrency limit in-flight) or down, calls fall back to Beast3's LM Studio
# over the LAN portproxy (192.168.50.173:1235). Both instances handle
# concurrency_limit requests at a time.
base_url: "http://127.0.0.1:1234/v1"
fallback_url: "http://192.168.50.173:1235/v1"
concurrency_limit: 4
# ComfyUI instances on BEAST5 whose running queue marks the GPU as busy.
# While any is rendering (krea2 image gen, H3 video), LLM calls prefer the
# fallback node instead of competing with the render for VRAM.
gpu_guard_urls:
  - "http://127.0.0.1:8188"
  - "http://127.0.0.1:8189"
model: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
# Context/parallel targets only; the loader (studio/gpu_manager.py
# preload_model) does NOT enforce these. LM Studio's remembered per-model
# settings (context length, concurrent slots, GPU offload) are authoritative.
context: 80000
parallel: 1
# Safety net for a non-streaming call that never returns; not a speed target.
request_timeout_s: 3600

# Output-token cap. max_output_tokens / max_tokens are OPTIONAL on both APIs, and
# every model/server already caps its own output; unused budget is free (billing is
# on ACTUAL tokens). So the client sends NO cap by default (0): omitting the field
# lets the server/model decide, and a low client cap only truncates a reasoning
# model (empty responses, unparseable JSON, spurious fallback to local).
#   0 = no client cap (default).  N>0 = optional ceiling: send max(caller hint, N).
max_output_tokens: 0

# Role -> model assignment. Model names must be loaded in LM Studio's catalog.
roles:
  showrunner: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  bible: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  script: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  judge: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  # Reviewers judge a fixed artifact against a rubric and return one verdict, so
  # an 8B model is enough - and nine of them finish in minutes instead of hours.
  slop_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  continuity_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  fan_service_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  growth_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  structure_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  voice_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  exposition_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  pacing_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  stakes_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  visual_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  agency_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  serial_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  repetition_reviewer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"
  describer: "gemma4-12b-qat-uncensored-hauhaucs-balanced"   # vision model (frame/image analysis)

gpu_offload: true          # if false, LLM runs on CPU during render phases
evict_before_render: true  # unload LLM before Krea 2 / H3 renders (per-node GPU manager)
