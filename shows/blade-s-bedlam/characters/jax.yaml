id: jax
name: Jax
role: episode supporting
appearance_canonical: Jax possesses vibrant, spiky azure hair that often defies gravity,
  contrasting sharply with piercing emerald green eyes. While maintaining his distinct
  vibrancy, the texture of his hair has been refined to appear less exaggerated and
  more grounded in a modern anime aesthetic. He is typically clad in a sleek, dark
  navy jacket over a crimson undershirt, paired with fitted black tactical pants and
  bright orange boots. His build remains athletic and lean, suggesting agility and
  underlying power, but the lines of his physique are rendered with greater anatomical
  detail to achieve a more 'realism' feel.
