appearance_canonical: Possessing vibrant, shoulder-length crimson hair styled in loose
  waves, 'None' has striking sapphire blue eyes that often hold a thoughtful, distant
  gaze. They are typically dressed in an elegant, high-collared black coat worn over
  a deep emerald green tunic and fitted trousers, maintaining a lean yet gracefully
  athletic build.
