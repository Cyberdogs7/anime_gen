id: chitinous-marauder-pods-x6
name: Chitinous Marauder Pods (x6)
role: episode supporting
appearance_canonical: These six pods possess sleek, obsidian exoskeletons that catch
  the light like polished chitin. Their 'heads' feature bioluminescent emerald eyes
  and narrow, menacing visors. They are generally compact and heavily armored, giving
  them a stocky yet agile build.
