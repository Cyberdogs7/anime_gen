id: siren
name: Siren
role: episode supporting
appearance_canonical: Siren possesses a sharp, athletic build and is defined by her
  intense gaze, which carries a subtle, knowing smile—often with the left corner twitching
  higher than the right. She wears tactical gear, prominently featuring a reflective
  helmet whose glass surface catches the light like polished chrome. Her posture is
  always poised and challenging, reinforcing the air of confident authority.
