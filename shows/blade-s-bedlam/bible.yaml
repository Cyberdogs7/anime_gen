title: Blade's Bedlam
logline: In a rain-drenched mega-city, a battle-hardened mercenary finds himself in
  the crosshairs of a deadly romance as four beautiful armorer-mercs fight for his
  affection and survival.
genre:
- Gritty Survival
- Romantic-Comedy
tone:
- Action-Packed
- Witty
- Tense
world:
  setting: A rain-drenched mega-city, filled with towering skyscrapers, neon lights,
    and a vast slum sprawl. The city is overrun by bio-mechs - synthetic lifeforms
    that wreak havoc on the population.
  rules:
  - The only way to survive in this city is through strength and cunning.
  - Technology is king; those who master it have the power.
  established_facts:
  - Bio-mechs are a constant threat, originating from unknown sources.
  - The city's government has been corrupted by powerful corporations that exploit
    the populace for profit.
overall_plotline:
  id: blades_romance
  name: Blade's Romance
  characters:
  - Blade
  - Lily
  - Ivy
  - Rose
  - Dahlia
  summary: A battle-hardened mercenary, Blade, finds himself the center of a deadly
    romance as four beautiful armorer-mercs - Lily, Ivy, Rose, and Dahlia - constantly
    push their skills to the limit in service of him. They fight not just for his
    affection, but through intense, synergistic competition, ensuring they are always
    ready to protect him from the city's relentless threats.
plotlines:
- id: lilys_rivalry
  name: Lily's Competitive Edge
  characters:
  - Lily
  - Ivy
  status: active
  summary: Lily and Ivy constantly challenge each other in high-stakes combat scenarios,
    not merely for Blade's gaze, but to prove whose armoring expertise is superior.
    Their rivalry manifests as an intense engineering competition during battles—who
    can craft the most resilient or offensively optimized hardsuit mid-fight—driving
    them to achieve peak synergy when fighting alongside Lily and Ivy against overwhelming
    bio-mech threats.
- id: roses_secrets
  name: Rose's Calculated Alliance
  characters:
  - Rose
  - Dahlia
  status: dormant
  summary: While Rose and Dahlia maintain a close bond, their internal dynamic is
    one of strategic alliance rather than passive friendship. Each harbors professional
    or personal secrets that could shift the balance of power between them. When these
    truths emerge, they don't devolve into petty arguments; instead, they redefine
    how they coordinate tactics in battle, creating a sharper, more focused partnership
    against enemy forces.
style_guide: The show's visual look is a blend of modern anime aesthetics with gritty
  realism, featuring detailed line art and vibrant colors for characters, contrasted
  against dark, rain-soaked cityscapes and the metallic sheen of hardsuits.
