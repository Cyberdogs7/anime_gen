title: Blade's Bedlam
logline: In a neon mega-city, a battle-hardened mercenary finds himself in the crosshairs
  of a deadly romance as four beautiful armorer-mercs fight for his affection and
  survival.
genre:
- Gritty Survival
- Romantic-Comedy
tone:
- Action-Packed
- Witty
- Tense
world:
  setting: A neon mega-city, filled with towering skyscrapers, neon lights, and a
    vast slum sprawl. The city is overrun by bio-mechs - synthetic lifeforms that
    wreak havoc on the population.
  rules:
  - The only way to survive in this city is through strength and cunning.
  - Technology is king; those who master it have the power.
  established_facts:
  - Bio-mechs are a constant threat, originating from unknown sources.
  - The city's government has been corrupted by powerful corporations that exploit
    the populace for profit.
overall_plotline:
  id: blades_romance
  name: Blade's Romance
  characters:
  - Blade
  - Lily
  - Ivy
  - Rose
  - Dahlia
  summary: A battle-hardened mercenary, Blade, finds himself the center of a deadly
    romance as four beautiful armorer-mercs - Lily, Ivy, Rose, and Dahlia - constantly
    push their skills to the limit in service of him. They fight not just for his
    affection, but through intense, synergistic competition, ensuring they are always
    ready to protect him from the city's relentless threats.
plotlines:
- id: roses_secrets
  name: Rose's Calculated Alliance
  characters:
  - Rose
  - Dahlia
  status: dormant
  summary: While Rose and Dahlia maintain a close bond, their internal dynamic is
    one of strategic alliance rather than passive friendship. Each harbors professional
    or personal secrets that could shift the balance of power between them. When these
    truths emerge, they don't devolve into petty arguments; instead, they redefine
    how they coordinate tactics in battle, creating a sharper, more focused partnership
    against enemy forces.
- id: dahlia-debt
  name: Dahlia's Hidden Obligation
  characters:
  - Dahlia
  - Jax
  summary: Dahlia is bound by a dangerous debt to underworld financier Jax, forcing
    her into high-risk retrieval missions outside the usual bio-mech skirmishes. This
    obligation threatens to shatter the trust she maintains with Rose and Blade regarding
    her past mercenary life.
  status: active
  last_seen_episode: 0
- id: ivy-ambition
  name: Ivy's Ascendant Ambition
  characters:
  - Ivy
  - Kael
  summary: Driven by a need to transcend her role as Blade's support, Ivy actively
    seeks recognition as an independent combat genius. This ambition is aggressively
    courted by Kael, a slick OmniCorp agent offering her a high-profile R&D position
    that promises status beyond the mercenary ranks.
  status: active
  last_seen_episode: 1
style_guide: The show's visual look is a blend of modern anime aesthetics with gritty
  realism, featuring detailed line art and vibrant colors for characters, contrasted
  against neon cityscapes and the metallic sheen of hardsuits.
