id: armorer_workshop_hideout
name: Mercenary Armory Hideout
description: A hidden workshop/base located deep within the slum sprawl. It is cluttered
  with advanced crafting stations, glowing holographic schematics of hardsuits, stacks
  of high-grade scrap metal, and specialized hydraulic tools. A single, reinforced
  bay door faces a perpetually wet alley.
setting_prompt: Sleek, high-tech subterranean engineering bay workshop background;
  pristine polished metal floors reflecting ambient light, walls paneled with matte
  obsidian plating, banks of ultra-modern diagnostic machinery emitting crisp cyan
  and amber lighting, organized shelves displaying modular weapon components in perfect
  rows, faint holographic schematic overlays shimmering near heavy industrial gantries,
  hyper-detailed cyberpunk anime setting.
