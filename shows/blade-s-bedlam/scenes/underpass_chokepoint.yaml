id: underpass_chokepoint
name: The Gauntlet Crossing
description: A critical intersection beneath several elevated transit lines. It serves
  as a frequent battleground, characterized by heavy industrial infrastructure and
  constant traffic of both pedestrian crowds and roaming bio-mechs.
setting_prompt: A massive, rain-slicked underpass structure. Heavy, rusted support
  pillars create deep shadows. Elevated magnetic rail tracks crisscross overhead.
  The ground is littered with debris from recent skirmishes, and distant glowing eyes
  of aggressive bio-mechs are visible in the mist.
