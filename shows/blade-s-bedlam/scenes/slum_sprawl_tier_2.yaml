id: slum_sprawl_tier_2
name: Mid-Level Slum Tier (The Gut)
description: A densely packed layer of housing and makeshift markets nestled between
  the towering corporate spires and the lower slums. Structures are haphazardly bolted
  together—rusted metal, exposed piping, corrugated iron shanties. The atmosphere
  is perpetually overcast and smells faintly of ozone and stale rain.
setting_prompt: Gritty mid-level slum cityscape background, dense cluster of rusted
  metallic housing units, tangled overhead wires illuminated by flickering yellow
  sodium lamps, constant drizzle effect, atmospheric anime scene.
