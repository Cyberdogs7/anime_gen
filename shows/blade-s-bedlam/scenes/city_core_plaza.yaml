id: city_core_plaza
name: Neon Nexus Plaza
description: The sprawling, highly trafficked central plaza of the mega-city. Dominated
  by colossal holographic advertisements flickering against slick, rain-soaked obsidian
  paving. High-end corporate towers pierce the perpetual gloom overhead.
setting_prompt: A vast, rain-slicked city plaza at night, dominated by towering skyscrapers
  clad in wet chrome and black glass. Intense neon signage—deep blues, vibrant magentas,
  toxic greens—reflects sharply on the puddles. Bio-mech silhouettes occasionally
  stomp through the background.
