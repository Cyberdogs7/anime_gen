id: armory_workshop
name: The Forgeheart Workshop
description: The primary operational base for the four armorer-mercs. A massive, semi-industrial
  space filled with specialized fabrication bays, holographic schematics floating
  mid-air, and banks of high-energy welding equipment.
setting_prompt: A vast, industrial workshop interior. Banks of heavy-duty assembly
  jigs line the walls. Sparks fly intermittently from active plasma welders. Holographic
  blueprints of intricate hardsuit designs shimmer over workbenches littered with
  polished metal components.
