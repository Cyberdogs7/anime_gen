id: corporate_skybox
name: OmniCorp Penthouse View
description: A sleek, minimalist observation lounge high up in one of the primary
  corporate towers. Features floor-to-ceiling polarized windows offering a terrifyingly
  beautiful panorama of the city's chaos below.
setting_prompt: Ultra-modern, sterile penthouse interior with polished white and dark
  chrome accents. A massive, curved window dominates the space, displaying a breathtaking,
  rain-streaked view of the entire mega-city sprawl bathed in chaotic neon light.
