id: neon_district_main
name: Neon District Central Hub
description: The primary, perpetually rain-slicked commercial district of the mega-city.
  Towering chrome and ferroconcrete skyscrapers are draped in chaotic, vibrant neon
  signage (blues, reds, toxic greens). Constant downpour reflects the light across
  wet pavement, creating shimmering pools of color.
setting_prompt: Rainy cyberpunk megacity street scene, towering chrome skyscrapers
  covered in holographic neon advertisements, glistening wet asphalt reflecting brilliant
  primary colors, dense urban sprawl, gritty realism anime style background still.
