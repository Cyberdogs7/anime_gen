id: mech_battlefield_zone
name: Bio-Mech Conflict Zone (Open Plaza)
description: A vast, relatively open plaza area frequently used for major skirmishes.
  The ground is cracked ferrocrete littered with debris, scorched metal plating, and
  pools of viscous bio-mech fluid. Heavy rain lashes down, often accompanied by flashes
  from distant combat.
setting_prompt: Vast open city battleground plaza background, heavily cracked ferroconcrete
  floor littered with metallic wreckage and glowing organic sludge, intermittent bursts
  of steam rising from fissures in the ground, dynamic lighting suggesting recent
  explosions, gritty action anime style.
