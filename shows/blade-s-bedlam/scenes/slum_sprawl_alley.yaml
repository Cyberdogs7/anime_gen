id: slum_sprawl_alley
name: Gutter Rat Alley
description: The labyrinthine backstreets of the city's lower tiers. Cramped, perpetually
  shadowed alleys choked with discarded tech parts, overflowing refuse bins, and makeshift
  vendor stalls clinging to crumbling ferro-concrete walls.
setting_prompt: A tight, claustrophobic alleyway in a mega-city slum. Walls are stained
  with grime and dripping moisture. Exposed conduits snake across the ceiling like
  metallic vines. The ground is a slurry of polluted water reflecting flickering,
  weak street lamps.
