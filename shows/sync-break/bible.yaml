title: Sync Break
logline: A 21-year-old hangar mechanic with freak co-pilot compatibility gets claimed
  as shared property by a disgraced all-women ace flight after he hot-wires their
  dead Frames mid-duel.
genre:
- romantic-comedy
- mecha
- action
tone:
- witty
- flirtatious
- rowdy
world:
  setting: A televised salvage-league city where corporate sponsor wings duel in neural-linked
    Frames for rank, contracts, and crowds, from the hangar pits to the bathhouse
    to the afterparty clubs.
  rules:
  - Frames only move with a pilot and co-pilot in high sync; most pairs cap at 40%,
    Ren spikes over 90% with anyone.
  - 'League salvage law: if you restart a dead Frame mid-duel, you and your contract
    go to that Frame''s owner.'
  - Cockpits lock to plug suits and live cables; a hot sync without calibration burns
    out nerves if held too long.
  - 'Rank is everything: wins, sponsors, bunks, and pit slots all follow the televised
    ladder.'
  established_facts:
  - Ren Tojo, 21, broke hangar mechanic, jammed a live cable into four locked Vixen
    cockpits and stole a televised duel topless in a borrowed plug suit.
  - Under salvage law the adult Vixen Flight now legally owns Ren's contract, his
    bunk, and his calibration schedule.
  - Vixen Flight are disgraced former aces dropped to the bottom of the ladder and
    need Ren in the cockpit to climb back.
  - Every rival wing is plotting to poach, buy out, or seduce Ren away.
