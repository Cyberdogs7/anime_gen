id: league-official
name: League Official
role: episode supporting
appearance_canonical: A 55-year-old man with stocky medium build, 5 foot 10 inches
  tall, light tan skin, short neat side-parted dark gray hair, brown almond-shaped
  eyes, clean-shaven face. He wears a navy blue polyester blazer with gold trim and
  a gold circular emblem pin on the left chest, white cotton button-up dress shirt,
  solid red polyester necktie, charcoal gray wool dress trousers, black leather belt
  with silver buckle, black leather oxford dress shoes.
