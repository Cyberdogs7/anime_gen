id: harrow-wing
name: Harrow Wing
role: episode supporting
appearance_canonical: Harrow Wing, a supporting character in this episode, appears
  to be 20 years old. He has a lean build and stands at approximately 6 feet tall.
  His skin tone is fair, with hair that is black and cut into a short bob style. His
  eyes are striking blue, shaped like almonds. A distinctive tattoo of a winged harrow
  decorates his right forearm. Harrow's outfit consists of a dark grey button-up shirt
  with a white collar, paired with black trousers. On his feet are a pair of polished
  black leather boots.
