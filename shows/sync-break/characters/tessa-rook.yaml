id: tessa-rook
name: Tessa Rook
role: soft-spoken heavy gunner and sync tech
appearance_canonical: 24-year-old woman, 5'9" tall with a thin slender build, very
  large breasts, pale skin with dense freckles across nose, cheeks, collarbones and
  shoulders, long wavy blonde hair in a thick low braid over her left shoulder with
