[project]
name = "anime-studio"
version = "0.1.0"
description = "Automated anime show creator - local-first studio in a box"
readme = "DESIGN.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["studio*"]
